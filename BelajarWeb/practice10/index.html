<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Circle</title>
</head>
<body>
    <div class="circle">CIRCLE</div>
    <div class="oval">OVAL</div>
    <div class="rounded-rectangle">ROUNDED RECTANGLE</div>
    <div class="rectangle">RECTANGLE</div>
    
    <div class="triangle-container">
  <!-- ViewBox mendefinisikan sistem koordinat kartesian 100x100 -->
  <svg viewBox="0 0 100 100" class="rounded-triangle">
    <!-- Titik koordinat (x,y) membentuk segitiga sama kaki -->
    <polygon points="50,15 90,85 10,85" />
  </svg>
</div>
    
</body>
</html>
