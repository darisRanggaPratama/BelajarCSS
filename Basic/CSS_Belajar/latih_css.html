<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS</title>
    <style>
        /* CSS Internal: Selector, Property, Value */
        h1, h5, h6 {
            color: white;
            font-size: 30px;
            background-color: black;
            border: 5px dashed red;
        }

        /* CSS Internal: Class */
        .test {
            color: blue;
            font-size: 24px;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* CSS Internal: ID. Unique */
        #myId {
            color: green;
            font-size: 20px;
            font-family: comic sans ms, cursive, sans-serif;
        }
    </style>
</head>
<body>  
    <h1>Latihan HTML        
    </h1>
    <h1>Belajar CSS</h1>
    <!-- CSS Inline: Selector, Property, Value -->
    <h3 style="color: blue; font-size: 24px;">Tidak pakai CSS</h3>
    <h5>Pakai CSS</h5>

    <!-- CSS Internal: Class -->
    <h6 class="test">Terpengaruh CSS: Class</h6>
    <h6>Tidak Terpengaruh CSS: Class</h6>

    <!-- CSS Internal: ID -->
    <h6 id="myId">Terpengaruh CSS: ID</h6>

    <a href="https://www.youtube.com">YouTube        
    </a>
    <button>Reset        
    </button>
    <img src="https://romsfun.com/wp-content/uploads/2023/10/Resident-Evil-Deep-Freeze.jpg" alt="Resident Evil Deep Freeze">

</body>
</html>
