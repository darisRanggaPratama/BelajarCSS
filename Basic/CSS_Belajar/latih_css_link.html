<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS</title>
    <link rel="stylesheet" href="./styles/latih_css_link.css"> 
</head>
<body>  
    <h1>Latihan HTML        
    </h1>
    <h1>Belajar CSS</h1>
    <!-- CSS Inline: Selector, Property, Value -->
    <h3 style="color: blue; font-size: 24 px;">Tidak pakai CSS</h3>
    <h5>Pakai CSS</h5>

    <!-- CSS Internal: Class -->
    <h6 class="test">Terpengaruh CSS: Class</h6>
    <h6>Tidak Terpengaruh CSS: Class</h6>

    <!-- CSS Internal: ID -->
    <h6 id="myId">Terpengaruh CSS: ID</h6>
 
    <a href="https://www.youtube.com">YouTube        
    </a>
    <button>Reset        
    </button>
    <img src="https://romsfun.com/wp-content/uploads/2023/10/Resident-Evil-Deep-Freeze.jpg" alt="Resident Evil Deep Freeze">

</body>
</html>
